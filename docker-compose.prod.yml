# ==============================================================
#  Teranga Voyages - PRODUCTION (serveur VPS)
#  1. cp .env.prod.example .env.prod   puis remplissez les valeurs
#  2. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#  Le code est copié dans les images (pas de volume de code), debug désactivé.
#  Placez un reverse-proxy HTTPS (Caddy, Traefik ou Nginx + Certbot) devant le port 80.
# ==============================================================
name: teranga-prod

x-backend-env: &backend-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?Definissez APP_KEY (voir README)}"
  APP_URL: ${APP_URL}
  FRONTEND_URL: ${APP_URL}
  LOG_LEVEL: warning
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: 3306
  DB_DATABASE: ${DB_DATABASE:-teranga}
  DB_USERNAME: ${DB_USERNAME:-teranga}
  DB_PASSWORD: "${DB_PASSWORD:?Definissez DB_PASSWORD}"
  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME}
  MAIL_PASSWORD: ${MAIL_PASSWORD}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
  AGENCY_NAME: ${AGENCY_NAME:-Teranga Voyages}
  AGENCY_EMAIL: ${AGENCY_EMAIL}
  AGENCY_PHONE: ${AGENCY_PHONE}
  PAYMENT_DEFAULT_DRIVER: ${PAYMENT_DEFAULT_DRIVER:-simulation}
  SEED_DEMO: ${SEED_DEMO:-false}
  WAVE_API_KEY: ${WAVE_API_KEY:-}
  WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-}
  CORS_ALLOWED_ORIGINS: ${APP_URL}

services:
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-teranga}
      MYSQL_USER: ${DB_USERNAME:-teranga}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?Definissez DB_ROOT_PASSWORD}"
      TZ: Africa/Dakar
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ./backend
      args:
        APP_ENV: production
    restart: always
    environment: *backend-env
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/app/public
      - logs:/var/www/html/storage/logs

  scheduler:
    build:
      context: ./backend
      args:
        APP_ENV: production
    restart: always
    environment:
      <<: *backend-env
      RUN_SETUP: "false"
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      - backend
    volumes:
      - uploads:/var/www/html/storage/app/public

  web:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - uploads:/var/www/html/storage/app/public:ro

volumes:
  mysql-data:
  uploads:
  logs:
