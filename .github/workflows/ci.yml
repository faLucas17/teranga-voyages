# Vérifie le projet à chaque envoi sur GitHub : tests Laravel + build React
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Tests Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, intl, zip, gd, bcmath
          coverage: none
      - name: Dépendances
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Tests
        run: php artisan test

  frontend:
    name: Build React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
